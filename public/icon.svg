<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="12 12" />
  <!-- Open Book Emblem -->
  <g transform="translate(106, 126) scale(0.58)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book Left Page -->
    <path d="M 256 460 C 180 410 70 410 20 460 L 20 100 C 70 50 180 50 256 100 Z" fill="rgba(255,255,255,0.95)" stroke="#ffffff" />
    <!-- Book Right Page -->
    <path d="M 256 460 C 332 410 442 410 492 460 L 492 100 C 442 50 332 50 256 100 Z" fill="rgba(255,255,255,0.95)" stroke="#ffffff" />
    <!-- Center Spine -->
    <line x1="256" y1="100" x2="256" y2="460" stroke="#059669" stroke-width="18" />
  </g>
  <!-- Sparkle Star on top -->
  <path d="M 256 80 L 268 112 L 300 124 L 268 136 L 256 168 L 244 136 L 212 124 L 244 112 Z" fill="#fef08a" />
  <!-- Merdeka ribbon text / sub-badge -->
  <rect x="136" y="385" width="240" height="50" rx="25" fill="#fef08a" />
  <text x="256" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#065f46" text-anchor="middle" letter-spacing="2">KURIKULUM MERDEKA</text>
</svg>
